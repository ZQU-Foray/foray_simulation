# /clock 与实际仿真时钟对齐（use_sim_time 必需）
- gz_topic: /clock
  ros_type: rosgraph_msgs/msg/Clock
  gz_type: ignition.msgs.Clock
  direction: gz2ros

# 前向 Mid-360 点云 → point_lio / foray_localization 消费的 /livox/lidar
- gz_topic: /world/rmul_2027/model/foray_sim_robot/link/front_mid360/sensor/front_mid360_lidar/scan/points
  ros_topic: /livox/lidar
  ros_type: sensor_msgs/msg/PointCloud2
  gz_type: ignition.msgs.PointCloudPacked
  direction: gz2ros

# IMU 与点云同一坐标系（point_lio 需要时间同步的 IMU）
- gz_topic: /world/rmul_2027/model/foray_sim_robot/link/front_mid360/sensor/front_mid360_imu/imu
  ros_topic: /livox/imu
  ros_type: sensor_msgs/msg/Imu
  gz_type: ignition.msgs.IMU
  direction: gz2ros

# Nav2 速度指令 → 车体平面速度控制
- gz_topic: /foray_sim_robot/cmd_vel
  ros_topic: /cmd_vel
  ros_type: geometry_msgs/msg/Twist
  gz_type: ignition.msgs.Twist
  direction: ros2gz

# 车体位姿（仿真真值，仅用于对照与调试，不参与定位）
- gz_topic: /world/rmul_2027/pose/info
  ros_topic: /sim/pose_info
  ros_type: tf2_msgs/msg/TFMessage
  gz_type: ignition.msgs.Pose_V
  direction: gz2ros
